name: Proof Gen API Deploy docker image to GCP (legacy)
# Superseded by docker-release.yml which is triggered by changeset version tags.
# Kept as a manual fallback for emergency deploys outside the release pipeline.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  generate-version:
    uses: 0xPolygon/pipelines/.github/workflows/generate_version.yaml@main

  docker-release:
    needs:
      - generate-version
    uses: 0xPolygon/pipelines/.github/workflows/gcp_pipeline_release_image.yaml@main
    with:
      image_name: 'proof-generation-api'
      image_tag: ${{ inputs.tag || needs.generate-version.outputs.version }}
      checkout_ref: ${{ github.ref_name }}
